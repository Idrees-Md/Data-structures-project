<!DOCTYPE html>
<html>
<head>
    <title>Sales Forecast Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📊 Sales Forecast Dashboard</h1>

<div class="container">

    <div class="form">
        <input type="text" id="date" placeholder="Date (dd-mm-yyyy)">
        <input type="number" id="amount" placeholder="Amount">
        <button onclick="addSale()">Add Sale</button>
    </div>

    <div class="controls">
        <button onclick="deleteSale()">Delete</button>
        <button onclick="undoDelete()">Undo</button>
        <button onclick="processQueueData()">Process Queue</button>
        <button onclick="forecast()">Forecast</button>
    </div>

    <div class="search">
        <input type="text" id="searchDate" placeholder="Search by date">
        <button onclick="searchSale()">Search</button>
    </div>

    <div class="stats">
        <p>Total: ₹<span id="total">0</span></p>
        <p>Average: ₹<span id="avg">0</span></p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <canvas id="chart"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
